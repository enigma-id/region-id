version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: region-id-postgres
    environment:
      POSTGRES_DB: regiondb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pkg/migration:/docker-entrypoint-initdb.d:ro
      - ./pkg/migration:/migration:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - region-id-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: region-id-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - region-id-network

networks:
  region-id-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
